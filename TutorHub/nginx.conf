# API proxy - Direct to local backend
location /api/ {
    # Use HTTP for local development (not HTTPS)
    proxy_pass http://localhost:5000/api/;  # Or port 5001 for HTTPS
    
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Remove SSL verification since using HTTP
    # proxy_ssl_verify off;  # Comment this out
    
    proxy_intercept_errors on;
    error_page 502 503 = @fallback;
}

# SignalR hubs
location /hubs/ {
    proxy_pass http://localhost:5000/hubs/;  # Use HTTP
    
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    proxy_read_timeout 86400s;
}